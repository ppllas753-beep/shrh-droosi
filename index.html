   البيانات المحلية
========================================= */

const localGrades =
    JSON.parse(
        localStorage.getItem("shrh_grades") || "[]"

    JSON.parse(

/* =========================================
   حماية النصوص
========================================= */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


/* =========================================
   البحث في الدروس المحلية
========================================= */

function searchLocalLessons(query){

    const q =
        query.toLowerCase().trim();


    return localLessons.filter(
        lesson => {

            const title =
                String(
                    lesson.title ||
                    lesson.name ||
                    ""
                ).toLowerCase();


            return title.includes(q);

        }
    );

}


/* =========================================
   عرض الدروس المحلية
========================================= */

function renderLocalLessons(lessons){

    const results =
        document.getElementById("results");


    let html = `

        <div class="youtube-title">

            📚 الدروس الموجودة في شرح دروسي

        </div>

    `;


    lessons.forEach(lesson => {

        const title =
            lesson.title ||
            lesson.name ||
            "درس بدون اسم";


        const description =
            lesson.description ||
            "شرح الدرس";


        html += `

            <div class="lesson">

                <h3>
                    ${escapeHTML(title)}
                </h3>

                <p>
                    ${escapeHTML(description)}
                </p>

            </div>

        `;

    });


    results.innerHTML += html;

}


/* =========================================
   البحث في YouTube
========================================= */

async function searchYouTube(query){

    const results =
        document.getElementById("results");


    try{

        const response =
            await fetch(
                `/api/youtube-search?q=${encodeURIComponent(query)}`
            );


        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        if(
            !data.success ||
            !data.items ||
            !data.items.length
        ){

            results.innerHTML += `

                <div class="message">

                    لم يتم العثور على شروحات
                    في YouTube.

                </div>

            `;

            return;

        }


        let html = `

            <div class="youtube-title">

                🎥 شروحات من YouTube

            </div>

        `;


        data.items.forEach(video => {

            if(
                !video.id ||
                !video.id.videoId
            ){

                return;

            }


            const videoId =
                video.id.videoId;


            const title =
                video.snippet?.title ||
                "شرح بدون عنوان";


            const channel =
                video.snippet?.channelTitle ||
                "YouTube";


            const thumbnail =
                video.snippet?.thumbnails?.medium?.url ||
                video.snippet?.thumbnails?.default?.url ||
                "";


            html += `

                <div class="youtube-card">

                    <img
                        src="${escapeHTML(thumbnail)}"
                        alt="صورة الفيديو"
                    >


                    <div class="youtube-info">

                        <div class="youtube-video-title">

                            ${escapeHTML(title)}

                        </div>


                        <div class="youtube-channel">

                            📺 ${escapeHTML(channel)}

                        </div>


                        <a
                            class="youtube-button"
                            href="https://www.youtube.com/watch?v=${encodeURIComponent(videoId)}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >

                            ▶️ شاهد الشرح

                        </a>

                    </div>

                </div>

            `;

        });


        results.innerHTML += html;


    }catch(error){

        console.error(
            "خطأ في البحث في YouTube:",
            error
        );


        results.innerHTML += `

            <div class="message">

                ⚠️ حدث خطأ أثناء البحث في YouTube.

                <br><br>

                تأكد أن الموقع مفتوح من:

                <br>

                <b>http://localhost:3000</b>

            </div>

        `;

    }

}

function getQuizForLesson(lesson,subject){

    const text =
        `${lesson} ${subject}`.toLowerCase();


    for(const key of Object.keys(quizBanks)){

        if(
            text.includes(
                key.toLowerCase()
            )
        ){

            return quizBanks[key];

        }

    }


    if(
        text.includes("نيوتن")
    ){

        return quizBanks["قوانين نيوتن"];

    }


    if(
        text.includes("حركة") ||
        text.includes("سرعة")
    ){

        return quizBanks["الحركة"];

    }


    if(
        text.includes("طاقة")
    ){

        return quizBanks["الطاقة"];

    }


    if(
        text.includes("ذرة") ||
        text.includes("كيمياء")
    ){

        return quizBanks["الذرة"];

    }


    if(
        text.includes("خلية") ||
        text.includes("أحياء")
    ){

        return quizBanks["الخلية"];

    }


    if(
        text.includes("past")
    ){

        return quizBanks["past simple"];

    }


    if(
        text.includes("present")
    ){

        return quizBanks["present simple"];

    }


    if(
        text.includes("مثلث")
    ){

        return quizBanks["المثلثات"];

    }


    if(
        text.includes("معادلة") ||
        text.includes("رياضيات")
    ){

        return quizBanks["المعادلات"];

    }


    return [

        {
            question:`ما الفكرة الأساسية التي يشرحها درس "${lesson}"؟`,

            options:[
                "فهم المفاهيم والقواعد المرتبطة بالدرس",
                "حفظ الاسم فقط",
                "تجاهل الأمثلة"
            ],

            answer:0
        },


        {
            question:`ما أفضل طريقة لدراسة "${lesson}"؟`,

            options:[
                "فهم الشرح ثم حل أمثلة",
                "الحفظ فقط",
                "عدم المراجعة"
            ],

            answer:0
        },


        {
            question:`ماذا تفعل عندما تجد سؤالًا صعبًا في "${lesson}"؟`,

            options:[
                "أراجع القاعدة وأحل السؤال خطوة بخطوة",
                "أتوقف مباشرة",
                "أترك السؤال بدون محاولة"
            ],

            answer:0
        },


        {
            question:`لماذا نراجع درس "${lesson}" بعد شرحه؟`,

            options:[
                "لتثبيت المعلومات وفهمها أكثر",
                "لنسيان المعلومات",
                "لإلغاء الأمثلة"
            ],

            answer:0
        },


        {
            question:`أي طريقة تساعد على تحسين مستواك في "${lesson}"؟`,

            options:[
                "التدرب على أسئلة متنوعة",
                "عدم حل الأسئلة",
                "قراءة اسم الدرس فقط"
            ],

            answer:0
        }

    ];

}


/* =========================================
   المتغير الحالي للاختبار
========================================= */

let currentQuiz = [];


/* =========================================
   إنشاء الاختبار
========================================= */

function showQuizButton(){

    const results =
        document.getElementById("results");


    const lesson =
        document
        .getElementById("lessonInput")
        .value
        .trim();


    const subject =
        document
        .getElementById("subject")
        .value;


    currentQuiz =
        getQuizForLesson(
            lesson,
            subject
        );


    currentQuiz =
        [...currentQuiz]
        .sort(
            () => Math.random() - 0.5
        )
        .slice(0,5);


    renderQuiz();

}


/* =========================================
   رسم الاختبار
========================================= */

function renderQuiz(){

    const results =
        document.getElementById("results");


    const lesson =
        document
        .getElementById("lessonInput")
        .value
        .trim();


    let html = `

        <div class="quiz">

            <div class="quiz-title">

                🧠 اختبر نفسك

            </div>


            <div class="quiz-subtitle">

                اختبار خاص بدرس:

                <b>
                    ${escapeHTML(lesson)}
                </b>

                <br>

                اختر الإجابة الصحيحة ثم اضغط
                على "تصحيح الاختبار".

            </div>

    `;


    currentQuiz.forEach(
        (question,index) => {

            html += `

                <div
                    class="quiz-question"
                    id="question-${index}"
                >

                    <div class="quiz-question-title">

                        ${index + 1}️⃣

                        ${escapeHTML(
                            question.question
                        )}

                    </div>

            `;


            question.options.forEach(
                (option,optionIndex) => {

                    html += `

                        <label
                            class="quiz-option"
                            id="option-${index}-${optionIndex}"
                        >

                            <input
                                type="radio"
                                name="q${index}"
                                value="${optionIndex}"
                            >

                            ${escapeHTML(option)}

                        </label>

                    `;

                }
            );


            html += `

                </div>

            `;

        }
    );


    html += `

            <button
                class="quiz-submit"
                onclick="checkQuiz()"
            >

                ✅ تصحيح الاختبار

            </button>


            <div
                id="quizResult"
                class="quiz-result"
            ></div>

        </div>

    `;


    results.innerHTML += html;

}


/* =========================================
   تصحيح الاختبار
========================================= */

function checkQuiz(){

    if(!currentQuiz.length){

        return;

    }


    let score = 0;


    currentQuiz.forEach(
        (question,index) => {

            const selected =
                document.querySelector(
                    `input[name="q${index}"]:checked`
                );


            question.options.forEach(
                (_,optionIndex) => {

                    const option =
                        document.getElementById(
                            `option-${index}-${optionIndex}`
                        );


                    if(option){

                        option.classList.remove(
                            "correct",
                            "wrong"
                        );

                    }

                }
            );


            const correctOption =
                document.getElementById(
                    `option-${index}-${question.answer}`
                );


            if(correctOption){

                correctOption.classList.add(
                    "correct"
                );

            }


            if(selected){

                const selectedIndex =
                    Number(
                        selected.value
                    );


                if(
                    selectedIndex ===
                    question.answer
                ){

                    score++;

                }else{

                    const wrongOption =
                        document.getElementById(
                            `option-${index}-${selectedIndex}`
                        );


                    if(wrongOption){

                        wrongOption.classList.add(
                            "wrong"
                        );

                    }

                }

            }

        }
    );


    const result =
        document.getElementById(
            "quizResult"
        );


    const total =
        currentQuiz.length;


    const percentage =
        Math.round(
            (score / total) * 100
        );


    let message;


    if(percentage === 100){

        message =
            "🔥 ممتاز جدًا! كل إجاباتك صحيحة.";

    }else if(percentage >= 80){

        message =
            "👏 ممتاز! مستواك رائع.";

    }else if(percentage >= 60){

        message =
            "👍 جيد، واصل المراجعة والتدريب.";

    }else{

        message =
            "📚 راجع الدرس وحاول الاختبار مرة أخرى.";

    }


    result.innerHTML = `

        <div class="score">

            ${score} / ${total}

        </div>


        <div style="margin-bottom:8px;">

            النسبة: ${percentage}%

        </div>


        <div>

            ${message}

        </div>


        <button
            class="restart-btn"
            onclick="restartQuiz()"
        >

            🔄 اختبار جديد

        </button>

    `;


    result.style.display =
        "block";


    document
    .querySelectorAll(
        '.quiz input[type="radio"]'
    )
    .forEach(
        input => {

            input.disabled = true;

        }
    );

}


/* =========================================
   اختبار جديد
========================================= */

function restartQuiz(){

    const lesson =
        document
        .getElementById("lessonInput")
        .value
        .trim();


    const subject =
        document
        .getElementById("subject")
        .value;


    currentQuiz =
        getQuizForLesson(
            lesson,
            subject
        );


    currentQuiz =
        [...currentQuiz]
        .sort(
            () => Math.random() - 0.5
        )
        .slice(0,5);


    const oldQuiz =
        document.querySelector(
            ".quiz"
        );


    if(!oldQuiz){

        return;

    }


    let html = `

        <div class="quiz-title">

            🧠 اختبار جديد

        </div>


        <div class="quiz-subtitle">

            درس:

            <b>
                ${escapeHTML(lesson)}
            </b>

        </div>

    `;


    currentQuiz.forEach(
        (question,index) => {

            html += `

                <div
                    class="quiz-question"
                    id="question-${index}"
                >

                    <div class="quiz-question-title">

                        ${index + 1}️⃣

                        ${escapeHTML(
                            question.question
                        )}

                    </div>

            `;


            question.options.forEach(
                (option,optionIndex) => {

                    html += `

                        <label
                            class="quiz-option"
                            id="option-${index}-${optionIndex}"
                        >

                            <input
                                type="radio"
                                name="q${index}"
                                value="${optionIndex}"
                            >

                            ${escapeHTML(option)}

                        </label>

                    `;

                }
            );


            html += `

                </div>

            `;

        }
    );


    html += `

        <button
            class="quiz-submit"
            onclick="checkQuiz()"
        >

            ✅ تصحيح الاختبار

        </button>


        <div
            id="quizResult"
            class="quiz-result"
        ></div>

    `;


    oldQuiz.innerHTML =
        html;

}


/* =========================================
   البحث الرئيسي
========================================= */

async function searchLesson(){

    const input =
        document.getElementById(
            "lessonInput"
        );


    const query =
        input.value.trim();


    if(!query){

        alert(
            "اكتب اسم الدرس أولاً."
        );

        return;

    }


    const semester =
        document.getElementById(
            "semester"
        ).value;


    const grade =
        document.getElementById(
            "grade"
        ).value;


    const subject =
        document.getElementById(
            "subject"
        ).value;


    const fullQuery = [

        grade,
        subject,
        semester,
        query

    ]

    .filter(Boolean)
    .join(" ");


    const results =
        document.getElementById(
            "results"
        );


    results.innerHTML = `

        <div class="loading">

            🔎 جاري البحث عن شرح الدرس...

        </div>

    `;


    /* =====================================
       الاتصال بالسيرفر
    ===================================== */

    try{

        const serverResponse =
            await fetch(
                `/api/search?q=${encodeURIComponent(fullQuery)}`
            );


        const serverData =
            await serverResponse.json();


        console.log(
            "Server:",
            serverData
        );

    }catch(error){

        console.error(
            "خطأ في الاتصال بالسيرفر:",
            error
        );

    }


    /* =====================================
       البحث المحلي
    ===================================== */

    const localResult =
        searchLocalLessons(
            query
        );


    if(localResult.length){

        results.innerHTML = "";

        renderLocalLessons(
            localResult
        );

    }else{

        results.innerHTML = `

            <div class="message">

                لم يتم العثور على الدرس
                في المحتوى المضاف.

                <br><br>

                🔎 جاري البحث عن
                شروحات خارجية...

            </div>

        `;

    }


    /* =====================================
       YouTube
    ===================================== */

    await searchYouTube(
        fullQuery
    );


    /* =====================================
       الويب
    ===================================== */

    showWebSearch(
        fullQuery
    );


    /* =====================================
       الاختبار
    ===================================== */

    showQuizButton();

}


/* =========================================
   Enter للبحث
========================================= */

document
.getElementById("lessonInput")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            searchLesson();

        }

    }
);

</script>
